        <!-- Couleur de la barre du navigateur sur mobile.

             Elle valait le grenat de « LE SIGNAL » — le systeme d'identite
             ALTERNATIF de src/styles/tokens.css, chaud et rouge, qui n'est
             importe nulle part et ne s'applique donc a aucune page. La barre
             annoncait ainsi une identite que le site n'affiche pas.

             Deux valeurs desormais, prises du systeme en vigueur et accordees
             au theme de l'appareil : Clinical White le jour, Ink la nuit. -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7FAFC" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0F14" />

        <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/brand/icon-32.png" sizes="32x32" type="image/png" />
        <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

        <meta name="description" content="Fironova supplies research-grade peptides for laboratory use only, with certificate-of-analysis documentation. For Research Use Only. Not for human consumption." />
        <link rel="canonical" href="https://fironova.com/" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Fironova" />
        <meta property="og:title" content="Fironova — Research Peptides (For Research Use Only)" />
        <meta property="og:description" content="Research-grade peptides for laboratory use, with certificate-of-analysis documentation. For Research Use Only." />

        <!-- Une carte partagee sans image ne montrait qu'un bloc de texte gris.
             Avec l'image, la carte large est le bon format : « summary » la
             rognerait en vignette. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://fironova.com/brand/og-image.png" />

        <!-- Les polices sont desormais servies par nous, depuis /fonts.
             Aucun appel a Google : plus aucune adresse IP de visiteur ne part
             chez un tiers, ce qui simplifie la position au regard de la Loi 25.

             Les deux graisses les plus employees sont prechargees. Sans cela,
             le navigateur doit d'abord lire fonts.css avant de decouvrir quoi
             telecharger — deux allers-retours au lieu d'un. -->
        <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/space-grotesk-700-latin.woff2" as="font" type="font/woff2" crossorigin />
        <!-- Les graisses demandees ici doivent couvrir EXACTEMENT celles que
             le code emploie, ni plus ni moins.

             `font-extrabold` (800) etait employe 37 fois sans etre charge. Le
             navigateur le fabriquait en epaississant le 700 — un rendu bave,
             different d'un navigateur a l'autre, et que rien ne signalait :
             le texte s'affichait, simplement moins bien.

             Les 37 cas portaient TOUS sur `font-display`, c'est-a-dire Space
             Grotesk — une famille qui s'arrete a 700 chez Google Fonts. Ajouter
             le poids 800 n'aurait donc rien corrige : ils sont passes a
             `font-bold`, la graisse la plus lourde que cette police possede
             reellement. Plus aucune graisse au-dela de 700 n'est employee, et
             aucune n'est donc telechargee pour rien. -->
        <link href="/fonts/fonts.css" rel="stylesheet" />

        <script src="/error-filter.js"></script>
    </head>
