[project]
name = "peps-backend"
version = "0.1.0"
description = "Production-oriented PEPS ecommerce backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
