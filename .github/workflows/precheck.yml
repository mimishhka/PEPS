name: Precheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Run unified precheck
        run: |
          chmod +x precheck.sh
          ./precheck.sh

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: fironova_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI-Admin-Password-2026!
      PUBLIC_BASE_URL: http://127.0.0.1:8001
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3000
      RESEND_API_KEY: ""
      NOWPAYMENTS_API_KEY: ""
      NOWPAYMENTS_IPN_SECRET: ci-nowpayments-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      # Avant de demarrer quoi que ce soit : ces tests n'ont besoin ni de la
      # base ni du serveur. Ils echouent en quelques secondes plutot qu'apres
      # une minute d'attente sur uvicorn.
      #
      # La liste se CALCULE au lieu d'etre recopiee. Les tests d'integration se
      # reconnaissent a REACT_APP_BACKEND_URL : ils frappent un backend vivant
      # et font `assert BASE_URL` au niveau module. `grep -L` retourne donc
      # exactement les fichiers unitaires — et un nouveau fichier unitaire est
      # couvert sans que personne pense a l'ajouter ici.
      #
      # Cette etape existe parce que cinq fichiers seulement etaient lances,
      # sur dix-sept. Les douze autres — dont toute la suite d'affiliation —
      # n'ont jamais tourne en integration continue.
      - name: Run backend unit tests
        working-directory: backend
        run: |
          FICHIERS=$(grep -L REACT_APP_BACKEND_URL tests/test_*.py | tr '\n' ' ')
          echo "Fichiers unitaires : $FICHIERS"
          test -n "$FICHIERS" || { echo "Aucun fichier unitaire detecte"; exit 1; }
          python -m pytest -q $FICHIERS

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/fironova-uvicorn.log 2>&1 &
          echo $! > /tmp/fironova-uvicorn.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/meta > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fironova-uvicorn.log
          exit 1

      # Les 19 fichiers d'integration, contre le backend et la base demarres
      # ci-dessus. Aucun script d'amorcage n'a ete necessaire : le serveur
      # appelle seed_admin_and_products() a son demarrage, et les tests creent
      # ensuite leurs propres affilies via l'API d'administration.
      #
      # continue-on-error PENDANT LA MISE EN ROUTE. Ces 170 tests n'ont jamais
      # tourne en integration continue et je n'ai pas pu les EXECUTER en local :
      # il y faut MongoDB, soit 592 Mo a telecharger sur la machine de
      # developpement. Ce que j'ai verifie, c'est qu'ils se COLLECTENT tous
      # proprement avec cet environnement — 170 collectes, zero erreur — ce qui
      # elimine les pannes d'import et de niveau module.
      #
      # Le reste doit se constater ici. Tant que ce drapeau est la, un echec
      # s'affiche sans faire passer l'ecusson au rouge : la tache vient d'etre
      # remise au vert apres dix-sept jours, et une nouvelle source de rouge
      # non diagnostiquee la rendrait a nouveau illisible.
      #
      # A RETIRER des que la premiere execution complete est verte.
      - name: Run backend integration tests (mise en route, non bloquant)
        continue-on-error: true
        working-directory: backend
        run: |
          FICHIERS=$(grep -l REACT_APP_BACKEND_URL tests/test_*.py | tr '\n' ' ')
          echo "Fichiers d'integration : $FICHIERS"
          python -m pytest -q $FICHIERS

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/fironova-uvicorn.log

  # ---------------------------------------------------------------------------
  # Alerte en cas d'echec — INERTE tant qu'aucun secret n'est defini.
  #
  # GitHub envoie deja un courriel a l'AUTEUR d'un push qui casse la chaine
  # (reglage du compte : Settings -> Notifications -> Actions). Ce qu'il ne fait
  # pas, c'est prevenir quand quelqu'un D'AUTRE casse `main`. C'est le trou par
  # lequel la tache est restee rouge dix-sept jours.
  #
  # POUR L'ACTIVER : creer un secret de depot nomme CI_WEBHOOK_URL contenant
  # l'URL d'un crochet entrant Slack ou Discord (Settings -> Secrets and
  # variables -> Actions -> New repository secret). Tant qu'il n'existe pas,
  # cette tache s'execute, ne trouve rien a envoyer, et se termine en succes :
  # elle ne peut donc pas faire passer l'ecusson au rouge.
  #
  # Le secret n'apparait jamais dans les journaux : il est lu dans une variable
  # d'environnement et passe a curl, jamais affiche.
  # ---------------------------------------------------------------------------
  alerte-echec:
    if: failure()
    needs: [precheck, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prevenir sur le crochet configure
        env:
          CROCHET: ${{ secrets.CI_WEBHOOK_URL }}
          DEPOT: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          AUTEUR: ${{ github.actor }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESUME: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CROCHET" ]; then
            echo "Aucun secret CI_WEBHOOK_URL n'est defini — aucune alerte a envoyer."
            echo "Voir le commentaire au-dessus de cette tache pour l'activer."
            exit 0
          fi
          SUJET=$(printf '%s' "$RESUME" | head -1)
          TEXTE=$(printf '%s\n%s\n%s\n%s' \
            "🔴 ${DEPOT} — la chaine est cassee sur ${BRANCHE}" \
            "Pousse par ${AUTEUR}" \
            "${SUJET}" \
            "${EXECUTION}")
          # jq construit le JSON : un message de commit peut contenir des
          # guillemets, des sauts de ligne ou une apostrophe, qui casseraient
          # une chaine assemblee a la main. `text` sert a Slack, `content` a
          # Discord : envoyer les deux evite de dependre du service choisi.
          jq -n --arg t "$TEXTE" '{text: $t, content: $t}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$CROCHET" \
            || echo "L'envoi de l'alerte a echoue — sans consequence sur la chaine."
