name: Precheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      # UNE ETAPE PAR PHASE, et non un seul « ./precheck.sh ».
      #
      # Les journaux d'execution demandent une session GitHub pour etre lus.
      # Les NOMS et les RESULTATS des etapes, eux, sont publics. Tant que tout
      # tenait dans une seule etape, « Run unified precheck : failure » ne
      # disait rien de plus que « quelque chose a casse » — et cette tache est
      # rouge depuis le 15 aout sans que personne ait pu dire quoi.
      #
      # Decoupee, la liste des etapes designe la phase fautive a elle seule.
      # precheck.sh reste le raccourci local : il enchaine exactement ces
      # memes commandes, dans le meme ordre.
      - name: Compilation Python
        run: |
          python -m compileall -q backend tests
          python -m py_compile backend/server.py

      - name: Sondes JSX
        run: python scripts/verifs/verifier.py

      - name: Dependances frontend
        working-directory: frontend
        run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      # NODE_OPTIONS : le decoupage en etapes a designe cette phase, et elle
      # seule. La construction reussit en local (262 s, code 0, CI=true compris)
      # et echoue sur le runner — qui dispose de 7 Go et d'un processeur bien
      # plus lent. Un depassement du tas de V8 est de loin l'explication la plus
      # frequente pour une construction Create React App qui ne casse QU'EN
      # integration continue.
      #
      # C'est une hypothese, pas un diagnostic : les journaux d'execution
      # demandent une session GitHub, que je n'ai pas. Le reglage est sans
      # inconvenient — il releve un plafond, il n'en abaisse aucun. Si l'etape
      # tombe encore, c'est qu'il faut chercher ailleurs.
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          yarn build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # LE NOM D'UN ARTEFACT EST PUBLIC ; le contenu des journaux ne l'est pas.
      #
      # C'est tout l'objet de cette etape. Sans session GitHub, « Build frontend
      # : failure » est tout ce qu'on peut lire — et deux tentatives de
      # correction a l'aveugle, c'est deja une de trop. La premiere ligne
      # d'erreur du journal devient donc le NOM de l'artefact, lisible par
      # l'API publique.
      #
      # L'artefact lui-meme contient le journal complet, telechargeable par
      # quiconque a un compte.
      - name: Journal du build (le nom porte l'erreur)
        if: failure()
        run: |
          LIGNE=$(grep -m1 -iE "error|failed|heap|ENOSPC|killed" "$RUNNER_TEMP/build.log" || true)
          [ -n "$LIGNE" ] || LIGNE=$(tail -3 "$RUNNER_TEMP/build.log" | head -1)
          # Le nom d'un artefact refuse " : < > | * ? \ /
          PROPRE=$(printf '%s' "$LIGNE" | tr -c 'A-Za-z0-9 ._-' '_' | cut -c1-90)
          printf 'build-%s\n' "${PROPRE:-inconnu}" > "$RUNNER_TEMP/nom.txt"
          cat "$RUNNER_TEMP/nom.txt"
          echo "NOM_ARTEFACT=$(cat "$RUNNER_TEMP/nom.txt")" >> "$GITHUB_ENV"

      - name: Televerser le journal du build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM_ARTEFACT }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7

      - name: Tests frontend
        working-directory: frontend
        run: yarn test --watchAll=false

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: fironova_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI-Admin-Password-2026!
      PUBLIC_BASE_URL: http://127.0.0.1:8001
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3000
      RESEND_API_KEY: ""
      NOWPAYMENTS_API_KEY: ""
      NOWPAYMENTS_IPN_SECRET: ci-nowpayments-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # requirements-ci.txt, PAS requirements.txt.
      #
      # `pip install -r requirements.txt` echoue sur les runners depuis le
      # 15 aout : l'etape tombait, donc AUCUN test backend ne s'est jamais
      # execute — pas meme les cinq fichiers qui etaient listes. Ce n'etait pas
      # « des tests echouent », c'etait « rien ne tourne ».
      #
      # requirements.txt decrit l'environnement complet de production : une
      # centaine de paquets dont google-genai, litellm servi depuis un hote
      # prive, jq qui compile libjq, fastuuid qui compile du Rust. Le backend
      # n'en importe AUCUN — verifie par analyse de l'arbre syntaxique de tout
      # backend/. requirements-ci.txt tient les dix-huit modules reellement
      # importes, et son installation a ete verifiee dans un environnement
      # neuf.
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-ci.txt

      # weasyprint a part, et TOLERANTE A L'ECHEC : import paresseux (une seule
      # fonction de generation de PDF) et bibliotheques Pango du systeme
      # requises. C'est le paquet qui fait le plus souvent tomber une
      # installation ; le mettre avec les autres ferait tomber tous les tests
      # pour un seul chemin de code.
      - name: Install weasyprint (optionnel)
        continue-on-error: true
        run: python -m pip install "weasyprint>=62.0"

      # Avant de demarrer quoi que ce soit : ces tests n'ont besoin ni de la
      # base ni du serveur. Ils echouent en quelques secondes plutot qu'apres
      # une minute d'attente sur uvicorn.
      #
      # La liste se CALCULE au lieu d'etre recopiee. Les tests d'integration se
      # reconnaissent a REACT_APP_BACKEND_URL : ils frappent un backend vivant
      # et font `assert BASE_URL` au niveau module. `grep -L` retourne donc
      # exactement les fichiers unitaires — et un nouveau fichier unitaire est
      # couvert sans que personne pense a l'ajouter ici.
      #
      # Cette etape existe parce que cinq fichiers seulement etaient lances,
      # sur dix-sept. Les douze autres — dont toute la suite d'affiliation —
      # n'ont jamais tourne en integration continue.
      - name: Run backend unit tests
        working-directory: backend
        run: |
          FICHIERS=$(grep -L REACT_APP_BACKEND_URL tests/test_*.py | tr '\n' ' ')
          echo "Fichiers unitaires : $FICHIERS"
          test -n "$FICHIERS" || { echo "Aucun fichier unitaire detecte"; exit 1; }
          python -m pytest -q $FICHIERS

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/fironova-uvicorn.log 2>&1 &
          echo $! > /tmp/fironova-uvicorn.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/meta > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fironova-uvicorn.log
          exit 1

      # Les 19 fichiers d'integration, contre le backend et la base demarres
      # ci-dessus. Aucun script d'amorcage n'a ete necessaire : le serveur
      # appelle seed_admin_and_products() a son demarrage, et les tests creent
      # ensuite leurs propres affilies via l'API d'administration.
      #
      # J'AVAIS CONCLU A TORT QU'ILS PASSAIENT. A l'execution 34257801355, cette
      # etape etait marquee « success » — mais elle portait continue-on-error,
      # et c'est precisement ce que fait ce drapeau : il force la CONCLUSION a
      # « success » quel que soit le resultat reel. L'API des taches n'expose
      # pas le champ `outcome`, qui seul dit la verite.
      #
      # Retire, ils echouent : execution 34258803375. Le drapeau revient donc,
      # et cette fois pour ce qu'il est — un aveu que ces 170 tests ne passent
      # pas encore et que personne ne les a jamais vus tourner.
      #
      # Meme traitement que le build : la premiere ligne d'echec devient le NOM
      # d'un artefact, seul canal lisible sans session GitHub.
      - name: Run backend integration tests (non bloquant, jamais encore verts)
        id: integration
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          FICHIERS=$(grep -l REACT_APP_BACKEND_URL tests/test_*.py | tr '\n' ' ')
          echo "Fichiers d'integration : $FICHIERS"
          python -m pytest -q $FICHIERS 2>&1 | tee "$RUNNER_TEMP/integration.log"

      # Le resume de pytest — « 12 failed, 158 passed » — devient le nom de
      # l'artefact, donc lisible sans session. La liste des tests en echec suit
      # dans le fichier.
      - name: Journal des tests d'integration (le nom porte le resume)
        if: steps.integration.outcome == 'failure'
        run: |
          RESUME=$(grep -oE "[0-9]+ failed[^|]*" "$RUNNER_TEMP/integration.log" | tail -1 || true)
          [ -n "$RESUME" ] || RESUME=$(tail -2 "$RUNNER_TEMP/integration.log" | head -1)
          PROPRE=$(printf '%s' "$RESUME" | tr -c 'A-Za-z0-9 ._-' '_' | cut -c1-90)
          echo "NOM_INTEGRATION=integration-${PROPRE:-inconnu}" >> "$GITHUB_ENV"
          echo "integration-${PROPRE:-inconnu}"

      - name: Televerser le journal d'integration
        if: steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM_INTEGRATION }}
          path: ${{ runner.temp }}/integration.log
          retention-days: 7

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/fironova-uvicorn.log

  # ---------------------------------------------------------------------------
  # Alerte en cas d'echec — INERTE tant qu'aucun secret n'est defini.
  #
  # GitHub envoie deja un courriel a l'AUTEUR d'un push qui casse la chaine
  # (reglage du compte : Settings -> Notifications -> Actions). Ce qu'il ne fait
  # pas, c'est prevenir quand quelqu'un D'AUTRE casse `main`. C'est le trou par
  # lequel la tache est restee rouge dix-sept jours.
  #
  # POUR L'ACTIVER : creer un secret de depot nomme CI_WEBHOOK_URL contenant
  # l'URL d'un crochet entrant Slack ou Discord (Settings -> Secrets and
  # variables -> Actions -> New repository secret). Tant qu'il n'existe pas,
  # cette tache s'execute, ne trouve rien a envoyer, et se termine en succes :
  # elle ne peut donc pas faire passer l'ecusson au rouge.
  #
  # Le secret n'apparait jamais dans les journaux : il est lu dans une variable
  # d'environnement et passe a curl, jamais affiche.
  # ---------------------------------------------------------------------------
  alerte-echec:
    if: failure()
    needs: [precheck, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prevenir sur le crochet configure
        env:
          CROCHET: ${{ secrets.CI_WEBHOOK_URL }}
          DEPOT: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          AUTEUR: ${{ github.actor }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESUME: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CROCHET" ]; then
            echo "Aucun secret CI_WEBHOOK_URL n'est defini — aucune alerte a envoyer."
            echo "Voir le commentaire au-dessus de cette tache pour l'activer."
            exit 0
          fi
          SUJET=$(printf '%s' "$RESUME" | head -1)
          TEXTE=$(printf '%s\n%s\n%s\n%s' \
            "🔴 ${DEPOT} — la chaine est cassee sur ${BRANCHE}" \
            "Pousse par ${AUTEUR}" \
            "${SUJET}" \
            "${EXECUTION}")
          # jq construit le JSON : un message de commit peut contenir des
          # guillemets, des sauts de ligne ou une apostrophe, qui casseraient
          # une chaine assemblee a la main. `text` sert a Slack, `content` a
          # Discord : envoyer les deux evite de dependre du service choisi.
          jq -n --arg t "$TEXTE" '{text: $t, content: $t}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$CROCHET" \
            || echo "L'envoi de l'alerte a echoue — sans consequence sur la chaine."
