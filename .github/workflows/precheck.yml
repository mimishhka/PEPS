name: Precheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Run unified precheck
        run: |
          chmod +x precheck.sh
          ./precheck.sh

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: fironova_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI-Admin-Password-2026!
      PUBLIC_BASE_URL: http://127.0.0.1:8001
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3000
      RESEND_API_KEY: ""
      NOWPAYMENTS_API_KEY: ""
      NOWPAYMENTS_IPN_SECRET: ci-nowpayments-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/fironova-uvicorn.log 2>&1 &
          echo $! > /tmp/fironova-uvicorn.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/meta > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fironova-uvicorn.log
          exit 1

      - name: Run backend security and regression tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_account_security_medium.py
          tests/test_headers_cors_data_leakage.py
          tests/test_payment_webhook_security.py
          tests/test_performance_regressions.py
          tests/test_pagination_scale.py

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/fironova-uvicorn.log
