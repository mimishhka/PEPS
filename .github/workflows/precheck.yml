name: Precheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Run unified precheck
        run: |
          chmod +x precheck.sh
          ./precheck.sh
